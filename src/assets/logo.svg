<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#915eff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cea8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bf61ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagon / Shield -->
  <polygon points="100,12 178,57 178,143 100,188 22,143 22,57" 
           fill="#151030" stroke="url(#grad1)" stroke-width="6" filter="url(#glow)" />
           
  <!-- Inner Circuit Glow Lines -->
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" 
           fill="#100d25" stroke="#915eff" stroke-width="2" stroke-opacity="0.4" />
           
  <!-- Stylized FA Monogram -->
  <g fill="none" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter F -->
    <path d="M60,65 L60,135" />
    <path d="M60,65 L105,65" />
    <path d="M60,98 L95,98" />
    
    <!-- Letter A combined -->
    <path d="M108,135 L128,65 L148,135" />
    <path d="M116,112 L140,112" />
  </g>
  
  <!-- Accent Dots -->
  <circle cx="100" cy="188" r="4" fill="#00cea8" />
  <circle cx="100" cy="12" r="4" fill="#915eff" />
</svg>
